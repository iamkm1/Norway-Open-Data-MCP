name: Publish

# Publishes norway-open-data-mcp to npm, and only ever for a pushed version tag.
#
# Authentication is GitHub OIDC trusted publishing: on a GitHub-hosted runner
# with `id-token: write` and a recent npm CLI, `npm publish` exchanges a
# short-lived OIDC token with the registry automatically. There is no
# NODE_AUTH_TOKEN, no NPM_TOKEN, no repository secret and no long-lived
# credential anywhere in this workflow. For a public repository and a public
# package, npm generates a provenance attestation automatically.
on:
  push:
    tags:
      - "v*"

# Least privilege: read the tagged tree, and mint the OIDC token used to
# authenticate the publish. Nothing else.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm (OIDC, provenance)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # No dependency cache in the publishing job, on purpose: a cache is
          # attacker-influenceable state that must not sit in the publish path.
          # This must be explicit — setup-node's package-manager cache defaults
          # to on, and it runs `pnpm` before Corepack has provisioned it, which
          # otherwise fails this step outright.
          package-manager-cache: false

      - name: Enable Corepack (provisions pnpm from packageManager)
        run: corepack enable pnpm

      - name: Confirm npm supports OIDC trusted publishing (>= 11.5.1)
        # Node 24 already bundles npm >= 11.5.1 (11.16.x), which supports OIDC
        # trusted publishing, so there is deliberately no global npm upgrade
        # here: installing npm@latest changed `npm pack --json` output and broke
        # the package smoke test during verify. Assert the floor instead of
        # upgrading, and fail fast if a runner ever ships something older.
        run: |
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          if [ "$(printf '%s\n11.5.1\n' "${npm_version}" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm ${npm_version} is below the 11.5.1 required for OIDC trusted publishing"
            exit 1
          fi

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Full verification pipeline
        run: pnpm verify

      - name: Verify the tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          echo "tag=${GITHUB_REF_NAME} tag_version=${tag_version} pkg_version=${pkg_version}"
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}"
            exit 1
          fi

      - name: Publish to npm (public, automatic provenance via OIDC)
        run: npm publish --access public
